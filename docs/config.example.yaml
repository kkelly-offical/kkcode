# =============================================================================
# kkcode 完整配置参考
# =============================================================================
# 配置文件加载优先级：项目配置 > 用户配置 > 默认配置
#
# 配置文件位置：
#   用户级：~/.kkcode/config.yaml
#   项目级：.kkcode/config.yaml 或项目根目录 kkcode.config.yaml
#
# 支持格式：YAML (.yaml/.yml) 和 JSON (.json)
#
# provider.*.retry_attempts 表示首次请求失败后的重连次数：
# 设为 5 时，最多是 1 次初始请求 + 5 次重连。
# =============================================================================

# =============================================================================
# 模型提供者配置
# =============================================================================
provider:
  default: "dashscope"
  strict_mode: false

  # --- OpenAI ---
  openai:
    type: "openai"
    api_key_env: "OPENAI_API_KEY"
    default_model: "gpt-5.5"
    models: [gpt-5.5, gpt-5.5-pro, gpt-5.4, gpt-5.4-mini, gpt-5.3-codex]
    timeout_ms: 120000
    stream_idle_timeout_ms: 120000
    max_tokens: 32768
    retry_attempts: 5
    retry_base_delay_ms: 800
    stream: true

  # --- Anthropic ---
  anthropic:
    type: "anthropic"
    api_key_env: "ANTHROPIC_API_KEY"
    default_model: "claude-sonnet-4-6"
    models: [claude-opus-4-7, claude-sonnet-4-6, claude-haiku-4-5-20251001]
    timeout_ms: 120000
    max_tokens: 32768
    retry_attempts: 5
    stream: true

  # --- 统一网关（从用户配置的 Base URL 动态读取模型）---
  # 将 default 切换为 gateway 后启用。protocol 决定本次推理使用哪套协议。
  gateway:
    type: "gateway"
    protocol: "openai"       # openai | anthropic
    base_url: "https://gateway.example.com"
    endpoints:
      openai: "/v1"
      anthropic: "/anthropic/v1"
      models: "/v1/models"
    api_key_env: "KK_GATEWAY_API_KEY"
    default_model: "model-id-from-the-catalog"
    discovery:
      enabled: true
      cache_ttl_ms: 900000
    timeout_ms: 120000
    max_tokens: 32768
    retry_attempts: 5
    stream: true

  # --- DashScope（通义千问 Qwen 系列）---
  dashscope:
    type: "openai-compatible"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    # 海外用户: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
    api_key_env: "DASHSCOPE_API_KEY"
    default_model: "qwen3.5-plus"
    models:
      - qwen3.5-plus
      - qwen3.5-flash
      - qwen3-max
      - qwen3-coder-plus
      - qwen-plus-latest
    timeout_ms: 120000
    max_tokens: 32768
    retry_attempts: 5
    stream: true

  # --- 智谱 GLM ---
  zhipu:
    type: "openai-compatible"
    base_url: "https://open.bigmodel.cn/api/paas/v4"
    # 海外用户: https://api.z.ai/api/paas/v4
    api_key_env: "ZHIPU_API_KEY"
    default_model: "glm-5.1"
    models: [glm-5.1, glm-5, glm-4.5, glm-4.5-air]
    timeout_ms: 120000
    max_tokens: 32768
    retry_attempts: 5
    stream: true

  # --- DeepSeek ---
  deepseek:
    type: "openai-compatible"
    base_url: "https://api.deepseek.com"
    api_key_env: "DEEPSEEK_API_KEY"
    default_model: "deepseek-v4-flash"
    # deepseek-chat / deepseek-reasoner are compatibility aliases until 2026-07-24.
    models: [deepseek-v4-flash, deepseek-v4-pro, deepseek-chat, deepseek-reasoner]
    timeout_ms: 120000
    max_tokens: 32768
    retry_attempts: 5
    stream: true

  # --- Google Gemini (OpenAI-compatible endpoint) ---
  gemini:
    type: "openai-compatible"
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
    api_key_env: "GEMINI_API_KEY"
    default_model: "gemini-3.5-flash"
    models: [gemini-3.5-flash, gemini-3.1-pro, gemini-3.1-flash-lite]
    timeout_ms: 120000
    max_tokens: 32768
    retry_attempts: 5
    stream: true

  # --- Moonshot Kimi ---
  kimi:
    type: "openai-compatible"
    base_url: "https://api.moonshot.ai/v1"
    api_key_env: "MOONSHOT_API_KEY"
    default_model: "kimi-k2.6"
    models: [kimi-k2.6, kimi-k2.5, moonshot-v1-128k, moonshot-v1-32k]
    timeout_ms: 120000
    max_tokens: 32768
    retry_attempts: 5
    stream: true

  # --- xAI Grok ---
  xai:
    type: "openai-compatible"
    base_url: "https://api.x.ai/v1"
    api_key_env: "XAI_API_KEY"
    default_model: "grok-4.3"
    models: [grok-4.3, grok-4.3-latest]
    timeout_ms: 120000
    max_tokens: 32768
    retry_attempts: 5
    stream: true

  # --- 本地 Ollama ---
  ollama:
    type: "ollama"
    base_url: "http://localhost:11434"
    api_key_env: ""
    default_model: "qwen3:32b"
    timeout_ms: 600000
    stream_idle_timeout_ms: 300000
    max_tokens: 16384
    retry_attempts: 5
    stream: true

# =============================================================================
# Agent 配置
# =============================================================================
agent:
  default_mode: "assistant"   # assistant | plan | agent | code | coding | longagent
  max_steps: 50

  longagent:
    max_iterations: 30
    no_progress_warning: 3
    no_progress_limit: 5
    heartbeat_timeout_ms: 120000
    checkpoint_interval: 5

    parallel:
      enabled: true
      max_concurrency: 3
      stage_pass_rule: "all_success"
      task_timeout_ms: 600000
      task_max_retries: 2

    hybrid:
      enabled: true
      intake: true
      completion_validation: true
      tdd_mode: false
      cross_review: true
      incremental_gates: true

    git:
      enabled: "ask"          # true | false | "ask"
      auto_branch: true
      auto_commit_stages: true
      auto_merge: true

# =============================================================================
# 权限配置（详见 configs/permission-*.yaml 模板）
# =============================================================================
permission:
  level: "auto"              # readonly | review | auto | edit | full-auto | yolo
  mode: "auto"               # legacy compatibility: auto | manual | yolo
  default_policy: "ask"       # allow | ask | deny
  non_tty_default: "deny"     # allow | allow_once | deny
  rules:
    - tool: read
      action: allow
    - tool: glob
      action: allow
    - tool: grep
      action: allow
    - tool: list
      action: allow

# =============================================================================
# Git 自动化配置
# =============================================================================
git_auto:
  enabled: true
  auto_snapshot: true
  max_snapshots: 50
  ttl_days: 7
  forbid_commit: true
  forbid_push: true
  full_auto: false

# =============================================================================
# 会话配置
# =============================================================================
session:
  max_history: 30
  recovery: true
  compaction_threshold_ratio: 0.7
  compaction_threshold_messages: 50
  context_cache_points: true

# =============================================================================
# 工具配置
# =============================================================================
tool:
  sources:
    builtin: true
    local: true
    mcp: true
    plugin: true
  bash_timeout_ms: 120000
  write_lock:
    mode: "file_lock"
    wait_timeout_ms: 120000

# =============================================================================
# 使用量与预算
# =============================================================================
usage:
  budget:
    session_usd: null
    global_usd: null
    warn_at_percent: 80
    strategy: "warn"          # warn | block

# =============================================================================
# UI 配置
# =============================================================================
update:
  enabled: true                 # check npm dist-tags for newer kkcode versions
  notify_on_startup: true       # print a startup notice when an update is available
  auto_install: false           # when true, runs npm install -g automatically after detecting an update
  channel: "latest"             # latest | preview | stable or any npm dist-tag
  check_interval_hours: 12
  registry: "https://registry.npmjs.org"
  timeout_ms: 2500

ui:
  layout: "compact"           # compact | comfortable
  markdown_render: true
  terminal:
    alternate_screen: "auto"  # auto | always | never
    mouse: "auto"             # auto | always | never
    bracketed_paste: true      # 多行粘贴作为一个输入块，不会误提交多次
    copy_on_select: true       # 在应用鼠标模式中，拖选后自动复制
    toast_duration_ms: 2600    # 模式/模型/权限切换提示的显示时间
  mode_colors:
    assistant: "#22d3ee"
    plan: "#00b7c2"
    agent: "#2ac26f"
    longagent: "#ff7a33"
  status:
    show_cost: true
    show_token_meter: true
