# =============================================================================
# kkcode 完整配置参考
# =============================================================================
# 配置文件加载优先级：项目配置 > 用户配置 > 默认配置
#
# 配置文件位置：
#   用户级：~/.kkcode/config.yaml
#   项目级：.kkcode/config.yaml 或项目根目录 kkcode.config.yaml
#
# 支持格式：YAML (.yaml/.yml) 和 JSON (.json)
#
# provider.*.retry_attempts 表示首次请求失败后的重连次数：
# 设为 5 时，最多是 1 次初始请求 + 5 次重连。
# =============================================================================

# =============================================================================
# 模型提供者配置
# =============================================================================
provider:
  default: "dashscope"
  strict_mode: false

  # --- OpenAI ---
  openai:
    type: "openai"
    api_key_env: "OPENAI_API_KEY"
    default_model: "gpt-5.5"
    models: [gpt-5.5, gpt-5.5-pro, gpt-5.4, gpt-5.4-mini, gpt-5.3-codex]
    timeout_ms: 120000
    stream_idle_timeout_ms: 120000
    max_tokens: 32768
    retry_attempts: 5
    retry_base_delay_ms: 800
    stream: true

  # --- Anthropic ---
  anthropic:
    type: "anthropic"
    api_key_env: "ANTHROPIC_API_KEY"
    default_model: "claude-sonnet-4-6"
    models: [claude-opus-4-7, claude-sonnet-4-6, claude-haiku-4-5-20251001]
    timeout_ms: 120000
    max_tokens: 32768
    retry_attempts: 5
    stream: true

  # --- 统一网关（从用户配置的 Base URL 动态读取模型）---
  # 将 default 切换为 gateway 后启用。protocol 决定本次推理使用哪套协议。
  gateway:
    type: "gateway"
    protocol: "openai"       # openai | anthropic
    base_url: "https://gateway.example.com"
    endpoints:
      openai: "/v1"
      anthropic: "/anthropic/v1"
      models: "/v1/models"
    api_key_env: "KK_GATEWAY_API_KEY"
    default_model: "model-id-from-the-catalog"
    discovery:
      enabled: true
      cache_ttl_ms: 900000
    timeout_ms: 120000
    max_tokens: 32768
    retry_attempts: 5
    stream: true

  # --- DashScope（通义千问 Qwen 系列）---
  dashscope:
    type: "openai-compatible"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    # 海外用户: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
    api_key_env: "DASHSCOPE_API_KEY"
    default_model: "qwen3.5-plus"
    models:
      - qwen3.5-plus
      - qwen3.5-flash
      - qwen3-max
      - qwen3-coder-plus
      - qwen-plus-latest
    timeout_ms: 120000
    max_tokens: 32768
    retry_attempts: 5
    stream: true

  # --- 智谱 GLM ---
  zhipu:
    type: "openai-compatible"
    base_url: "https://open.bigmodel.cn/api/paas/v4"
    # 海外用户: https://api.z.ai/api/paas/v4
    api_key_env: "ZHIPU_API_KEY"
    default_model: "glm-5.1"
    models: [glm-5.1, glm-5, glm-4.5, glm-4.5-air]
    timeout_ms: 120000
    max_tokens: 32768
    retry_attempts: 5
    stream: true

  # --- DeepSeek ---
  deepseek:
    type: "openai-compatible"
    base_url: "https://api.deepseek.com"
    api_key_env: "DEEPSEEK_API_KEY"
    default_model: "deepseek-v4-flash"
    # deepseek-chat / deepseek-reasoner are compatibility aliases until 2026-07-24.
    models: [deepseek-v4-flash, deepseek-v4-pro, deepseek-chat, deepseek-reasoner]
    timeout_ms: 120000
    max_tokens: 32768
    retry_attempts: 5
    stream: true

  # --- Google Gemini (OpenAI-compatible endpoint) ---
  gemini:
    type: "openai-compatible"
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
    api_key_env: "GEMINI_API_KEY"
    default_model: "gemini-3.5-flash"
    models: [gemini-3.5-flash, gemini-3.1-pro, gemini-3.1-flash-lite]
    timeout_ms: 120000
    max_tokens: 32768
    retry_attempts: 5
    stream: true

  # --- Moonshot Kimi ---
  kimi:
    type: "openai-compatible"
    base_url: "https://api.moonshot.ai/v1"
    api_key_env: "MOONSHOT_API_KEY"
    default_model: "kimi-k2.6"
    models: [kimi-k2.6, kimi-k2.5, moonshot-v1-128k, moonshot-v1-32k]
    timeout_ms: 120000
    max_tokens: 32768
    retry_attempts: 5
    stream: true

  # --- xAI Grok ---
  xai:
    type: "openai-compatible"
    base_url: "https://api.x.ai/v1"
    api_key_env: "XAI_API_KEY"
    default_model: "grok-4.3"
    models: [grok-4.3, grok-4.3-latest]
    timeout_ms: 120000
    max_tokens: 32768
    retry_attempts: 5
    stream: true

  # --- 本地 Ollama ---
  ollama:
    type: "ollama"
    base_url: "http://localhost:11434"
    api_key_env: ""
    default_model: "qwen3:32b"
    timeout_ms: 600000
    stream_idle_timeout_ms: 300000
    max_tokens: 16384
    retry_attempts: 5
    stream: true

# =============================================================================
# Agent 配置
# =============================================================================
agent:
  # 0.4.0 模式 id：plan | agent | agent-auto | ultra | yolo
  # 旧写法 assistant / code / coding / longagent 仍可用并自动映射
  default_mode: "agent"
  max_steps: 50

  # Ultra（0.3.x 名为 longagent）；两个键名都能读，新配置用 agent.ultra
  longagent:
    max_iterations: 30
    no_progress_warning: 3
    no_progress_limit: 5
    heartbeat_timeout_ms: 120000
    checkpoint_interval: 5

    parallel:
      enabled: true
      max_concurrency: 3
      stage_pass_rule: "all_success"
      task_timeout_ms: 600000
      task_max_retries: 2

    hybrid:
      intake: true
      completion_validation: true
      tdd_mode: false
      cross_review: true
      incremental_gates: true

    git:
      enabled: "ask"          # true | false | "ask"
      auto_branch: true
      auto_commit_stages: true
      auto_merge: true

    # 可用性门禁。六道：build / test / review / health / budget / smoke
    usability_gates:
      # smoke 是唯一会「把产物真的跑起来」的一道 —— 其余五道全是静态检查，
      # 接不住「编译过了但一启动就崩」（改入口文件、改 import 图、删掉还有人
      # 引用的导出时最容易出现，而那正是 agent 最爱做的改动）。
      smoke:
        enabled: true
        # 留空时自动发现入口：package.json 的 bin（跑 --version）或 main
        # （import 一次）。都找不到就判 not_applicable —— 乱猜启动命令会在
        # 别人的项目里制造假失败，比没有这道门禁更糟。
        # command: "npm"
        # args: ["run", "start:check"]
        timeout_ms: 20000

# =============================================================================
# 权限配置（详见 configs/permission-*.yaml 模板）
# =============================================================================
permission:
  # readonly | manual | accept-edits | yolo
  # 0.6.0 起旧名（review/auto/edit/full-auto）与 permission.mode /
  # permission.default_policy 一并移除：写旧名会报错并指出对应的新写法，
  # 而不是静默映射 —— 权限档悄悄变松是最不该发生的一类升级事故。
  level: "manual"
  non_tty_default: "deny"     # allow_once | deny
  # 审批弹窗里选择 "Always Allow" 时，规则会自动追加到用户级配置的
  # permission.rules[]，并带上 workspace 限定与 source: learned 标记
  rules:
    - tool: read
      action: allow
    - tool: glob
      action: allow
    - tool: grep
      action: allow
    - tool: list
      action: allow

# =============================================================================
# Git 自动化配置
# =============================================================================
git_auto:
  enabled: true
  auto_snapshot: true
  max_snapshots: 50
  ttl_days: 7
  forbid_commit: true
  forbid_push: true
  full_auto: false

# =============================================================================
# 会话配置
# =============================================================================
session:
  max_history: 30
  recovery: true
  compaction_threshold_ratio: 0.85
  compaction_threshold_messages: 200
  context_cache_points: true

# =============================================================================
# 工具配置
# =============================================================================
tool:
  sources:
    builtin: true
    local: true
    mcp: true
    plugin: true
  bash_timeout_ms: 120000
  write_lock:
    mode: "file_lock"
    wait_timeout_ms: 120000

  # 单次工具输出占模型上下文的比例。上限随模型上下文变化，压在
  # [16000, 200000] 字符之间 —— 128k 模型和 1M 模型不该用同一个数字。
  output_budget_ratio: 0.08

  # 出网工具（webfetch / http_request）
  http:
    # 允许访问回环与内网地址。默认关闭：`webfetch` 曾能把
    # http://127.0.0.1:PORT/admin 的响应体原样读回来，也就是可以当内网扫描器
    # 用。云元数据端点（169.254.169.254 等）**无论这项怎么配都拒绝** ——
    # 它返回的是实例凭证，不是数据。
    allow_private_hosts: false

  # 需要额外确认的文件模式。这里写的会**并入**内置默认（.env、.env.*、
  # .github/workflows/** 等），不会替换它们 —— 想加一条不该顺带减掉六条。
  sensitive_file_patterns:
    - "secrets/**"
  # 真要丢掉内置默认才打开这个（不建议）
  sensitive_file_patterns_replace: false

# =============================================================================
# 永不自动放行的路径（内置，不可通过 permission.rules 覆盖）
# =============================================================================
# .git/、.kkcode/、.github/workflows/、全套 shell rc（.bashrc/.zshrc/.envrc）、
# 包管理器配置（.npmrc/.yarnrc/bunfig.toml）、.mcp.json 等位置的写入一律要人
# 确认，yolo 档也不例外。原因是这些是唯一一类无法靠 git 回滚补救的改动。
#
# 这条检查排在 permission.rules 之前 —— 否则仓库里 checked-in 的一条 allow
# 规则就能绕过它，而那条规则可能来自你刚 clone 的别人的仓库。

# =============================================================================
# 技能（Skills）
# =============================================================================
skills:
  enabled: true
  auto_seed: true
  dirs:
    - ".kkcode/skills"
  # 技能里允许执行的命令白名单。空表示技能不能自己执行命令 ——
  # 技能文件可能来自项目仓库，默认不给它执行权。
  allowed_commands: []

# =============================================================================
# 使用量与预算
# =============================================================================
usage:
  budget:
    session_usd: null
    global_usd: null
    warn_at_percent: 80
    strategy: "warn"          # warn | block

# =============================================================================
# UI 配置
# =============================================================================
update:
  enabled: true                 # check npm dist-tags for newer kkcode versions
  notify_on_startup: true       # print a startup notice when an update is available
  auto_install: false           # when true, runs npm install -g automatically after detecting an update
  channel: "latest"             # latest | preview | stable or any npm dist-tag
  check_interval_hours: 12
  registry: "https://registry.npmjs.org"
  timeout_ms: 2500

ui:
  layout: "compact"           # compact | comfortable
  markdown_render: true
  terminal:
    alternate_screen: "auto"  # auto | always | never
    mouse: "auto"             # auto | always | never
    bracketed_paste: true      # 多行粘贴作为一个输入块，不会误提交多次
    copy_on_select: true       # 在应用鼠标模式中，拖选后自动复制
    toast_duration_ms: 2600    # 模式/模型/权限切换提示的显示时间
  notify:
    enabled: true              # 总开关：关掉则标题/响铃/桌面通知一律不发
    title: true                # 终端标题（OSC 2），tmux/screen 下自动包 passthrough
    bell: false                # 终端响铃，默认关
    desktop: "auto"            # auto | always | never；auto = 非 SSH 且平台支持
    min_duration_ms: 30000     # 回合超过这个时长才通知；审批/提问不看时长
  mode_colors:
    assistant: "#22d3ee"
    plan: "#00b7c2"
    agent: "#2ac26f"
    longagent: "#ff7a33"
  status:
    show_cost: true
    show_token_meter: true
