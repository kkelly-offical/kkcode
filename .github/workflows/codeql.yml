name: CodeQL

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "21 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: java-kotlin
            build-mode: manual
    steps:
      # These action versions were verified against their upstream releases.
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 17
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up pinned Gradle
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: "8.14.3"
          cache-provider: basic
          cache-disabled: true
      - name: Install Android SDK packages
        if: matrix.language == 'java-kotlin'
        shell: bash
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config: |
            disable-default-queries: false
            threat-models: [remote]
      - name: Build Android for CodeQL extraction
        if: matrix.language == 'java-kotlin'
        working-directory: android
        shell: bash
        # Kotlin requires a traced build AFTER init. Fresh compilation prevents
        # caches/previous daemons from leaving the extractor with no source.
        # Debug builds cover the shared production Kotlin without release keys;
        # compile the unit/instrumentation sources too, without running an AVD.
        run: |
          gradle --no-daemon --no-build-cache --rerun-tasks --max-workers=2 \
            -Pkotlin.incremental=false \
            :app:assembleDebug :app:compileDebugUnitTestKotlin :app:assembleDebugAndroidTest
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          # Preserve the existing default-setup analysis categories on migration.
          category: /language:${{ matrix.language }}
          upload: always
