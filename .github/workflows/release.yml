name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # 发布前先过跨平台 lint + test 矩阵；完整 release:verify 在后续
  # Ubuntu 22 发布 job 中单独运行。平台组合与 verify.yml 一致。
  # 0.4.2–0.5.3 期间四个版本在 main verify（Windows job）红着的情况下发了出去：
  # release 工作流只有 ubuntu 单 job，tag 推送又不触发 verify.yml，
  # 跨平台失败对发布流程完全不可见。发布必须被该矩阵挡住。
  matrix_verify:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 22
          - os: macos-latest
            node: 22
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-search
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run version:check
      - run: npm run lint
      - run: npm test
      - name: Stress concurrent audit writers on Windows
        if: matrix.os == 'windows-latest'
        run: node scripts/audit-concurrency-smoke.mjs

  release_verify:
    timeout-minutes: 45
    needs: matrix_verify
    environment: npm-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-search
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Use current npm CLI
        run: npm install --global npm@11.13.0
      - run: npm ci
      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          node scripts/check-release-version.mjs
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            # Preview and RC tags have the same protected-main ancestry gate as
            # stable releases. A missing origin/main reference is never a pass.
            if ! git fetch --no-tags origin main; then
              echo "::error::Could not fetch origin/main to verify the tag's ancestry"
              exit 1
            fi
            if ! git merge-base --is-ancestor "${GITHUB_SHA}" FETCH_HEAD; then
              echo "::error::Tag ${GITHUB_REF_NAME} points at a commit that is not on origin/main"
              exit 1
            fi
          fi
          # Version syntax and preview/next/latest routing share one tested
          # policy helper. No publish output is written before ancestry passes.
          node --input-type=module <<'NODE'
          import { appendFile } from 'node:fs/promises'
          import { checkReleaseVersions } from './scripts/check-release-version.mjs'
          import { resolveReleaseMetadata } from './scripts/release-policy.mjs'
          const { version } = await checkReleaseVersions()
          const metadata = resolveReleaseMetadata({ version, refType: process.env.GITHUB_REF_TYPE, refName: process.env.GITHUB_REF_NAME })
          await appendFile(process.env.GITHUB_OUTPUT, Object.entries(metadata).map(([key, value]) => `${key}=${value}\n`).join(''))
          NODE
      - run: npm run release:verify
      - name: Audit production dependencies
        run: npm audit --registry=https://registry.npmjs.org --omit=dev --audit-level=high
      - name: Generate CycloneDX SBOM
        env:
          SBOM_FILE: kkcode-${{ steps.release.outputs.release_version }}.cdx.json
        run: npm sbom --sbom-format=cyclonedx > "$SBOM_FILE"
      - name: Build immutable npm package
        id: package
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
        shell: bash
        run: |
          package_dir="${RUNNER_TEMP}/kkcode-package"
          mkdir -p "$package_dir"
          pack_json="$(npm pack --ignore-scripts --json --pack-destination "$package_dir")"
          tarball_name="$(PACK_JSON="$pack_json" node -p 'JSON.parse(process.env.PACK_JSON)[0].filename')"
          tarball="${package_dir}/${tarball_name}"
          if [[ ! -f "$tarball" ]]; then
            echo "::error::npm pack did not create the expected tarball"
            exit 1
          fi
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$tarball" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Verify immutable npm package
        env:
          KKCODE_PACKAGE_TARBALL: ${{ steps.package.outputs.tarball }}
        run: npm run package:verify-artifact
      - name: Confirm npm package stayed immutable
        env:
          PACKAGE_TARBALL: ${{ steps.package.outputs.tarball }}
          EXPECTED_SHA256: ${{ steps.package.outputs.sha256 }}
        shell: bash
        run: |
          actual_sha256="$(sha256sum "$PACKAGE_TARBALL" | awk '{print $1}')"
          if [[ "$actual_sha256" != "$EXPECTED_SHA256" ]]; then
            echo "::error::The verified npm tarball changed after it was built."
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: kkcode-${{ steps.release.outputs.release_version }}-sbom
          path: kkcode-${{ steps.release.outputs.release_version }}.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: kkcode-${{ steps.release.outputs.release_version }}-npm-package
          path: ${{ steps.package.outputs.tarball }}
      - name: Publish npm package
        if: steps.release.outputs.publish == 'true'
        env:
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
          PACKAGE_TARBALL: ${{ steps.package.outputs.tarball }}
          EXPECTED_SHA256: ${{ steps.package.outputs.sha256 }}
        shell: bash
        run: |
          if [[ -z "${NODE_AUTH_TOKEN}" ]]; then
            echo "::error::The npm-release environment is missing the NPM_TOKEN secret."
            exit 1
          fi

          actual_sha256="$(sha256sum "$PACKAGE_TARBALL" | awk '{print $1}')"
          if [[ "$actual_sha256" != "$EXPECTED_SHA256" ]]; then
            echo "::error::Refusing to publish: the npm tarball changed after verification."
            exit 1
          fi

          package_name="$(node -p "require('./package.json').name")"
          published_version="$(npm view "${package_name}@${RELEASE_VERSION}" version --registry=https://registry.npmjs.org 2>/dev/null || true)"
          if [[ "${published_version}" == "${RELEASE_VERSION}" ]]; then
            echo "${package_name}@${RELEASE_VERSION} is already published; skipping npm publish."
          else
            # Publish the exact tarball that package:verify-artifact unpacked and scanned.
            # --ignore-scripts prevents a second lifecycle hook from changing it.
            npm publish "$PACKAGE_TARBALL" --ignore-scripts --access public --tag "$DIST_TAG"
          fi
      - name: Create or update GitHub Release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          SBOM_FILE: kkcode-${{ steps.release.outputs.release_version }}.cdx.json
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            if [[ "$PRERELEASE" == "true" ]]; then
              gh release edit "$tag" --title "$tag" --prerelease --latest=false
            else
              gh release edit "$tag" --title "$tag" --latest
            fi
          elif [[ "$PRERELEASE" == "true" ]]; then
            gh release create "$tag" --title "$tag" --generate-notes --verify-tag --prerelease --latest=false
          else
            gh release create "$tag" --title "$tag" --generate-notes --verify-tag --latest
          fi
          gh release upload "$tag" "$SBOM_FILE" --clobber
