name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # 发布前先过完整 verify 矩阵 —— 与 verify.yml 同一组平台。
  # 0.4.2–0.5.3 期间四个版本在 main verify（Windows job）红着的情况下发了出去：
  # release 工作流只有 ubuntu 单 job，tag 推送又不触发 verify.yml，
  # 跨平台失败对发布流程完全不可见。发布必须被全矩阵挡住。
  matrix_verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 22
          - os: macos-latest
            node: 22
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  release_verify:
    needs: matrix_verify
    environment: npm-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Use current npm CLI
        run: npm install --global npm@11.13.0
      - run: npm ci
      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"

          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "release_version=${package_version}" >> "$GITHUB_OUTPUT"
            echo "dist_tag=" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag_version="${GITHUB_REF_NAME#v}"
          if [[ ! "${tag_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::Unsupported release tag: ${GITHUB_REF_NAME}"
            exit 1
          fi

          if [[ "${package_version}" != "${tag_version}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} must point to a commit whose package version is ${tag_version}, found ${package_version}"
            exit 1
          fi

          lock_version="$(node -p "require('./package-lock.json').version")"
          if [[ "${lock_version}" != "${tag_version}" ]]; then
            echo "::error::package-lock.json says ${lock_version}, expected ${tag_version} — run 'npm install --package-lock-only'"
            exit 1
          fi

          # 只有 main 上的提交可以发布。打在功能分支或游离提交上的 tag
          # 会跳过 main 的分支保护与检查，属于绕过门禁的口子。
          # tag 检出不带 origin/main 引用，必须显式抓取；抓不到就直接失败，
          # 绝不因为「查不到」而放行。
          if ! git fetch --no-tags origin main; then
            echo "::error::Could not fetch origin/main to verify the tag's ancestry"
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" FETCH_HEAD; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at a commit that is not on origin/main"
            exit 1
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "release_version=${tag_version}" >> "$GITHUB_OUTPUT"
          if [[ "${tag_version}" == *-rc.* ]]; then
            echo "dist_tag=next" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - run: npm run release:verify
      - name: Audit production dependencies
        run: npm audit --registry=https://registry.npmjs.org --omit=dev --audit-level=high
      - name: Generate CycloneDX SBOM
        env:
          SBOM_FILE: kkcode-${{ steps.release.outputs.release_version }}.cdx.json
        run: npm sbom --sbom-format=cyclonedx > "$SBOM_FILE"
      - uses: actions/upload-artifact@v7
        with:
          name: kkcode-${{ steps.release.outputs.release_version }}-sbom
          path: kkcode-${{ steps.release.outputs.release_version }}.cdx.json
      - name: Publish npm package
        if: steps.release.outputs.publish == 'true'
        env:
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
        shell: bash
        run: |
          if [[ -z "${NODE_AUTH_TOKEN}" ]]; then
            echo "::error::The npm-release environment is missing the NPM_TOKEN secret."
            exit 1
          fi

          package_name="$(node -p "require('./package.json').name")"
          published_version="$(npm view "${package_name}@${RELEASE_VERSION}" version --registry=https://registry.npmjs.org 2>/dev/null || true)"
          if [[ "${published_version}" == "${RELEASE_VERSION}" ]]; then
            echo "${package_name}@${RELEASE_VERSION} is already published; skipping npm publish."
          else
            npm publish --access public --tag "$DIST_TAG"
          fi
      - name: Create or update GitHub Release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          SBOM_FILE: kkcode-${{ steps.release.outputs.release_version }}.cdx.json
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            if [[ "$PRERELEASE" == "true" ]]; then
              gh release edit "$tag" --title "$tag" --prerelease
            else
              gh release edit "$tag" --title "$tag" --latest
            fi
          elif [[ "$PRERELEASE" == "true" ]]; then
            gh release create "$tag" --title "$tag" --generate-notes --verify-tag --prerelease
          else
            gh release create "$tag" --title "$tag" --generate-notes --verify-tag --latest
          fi
          gh release upload "$tag" "$SBOM_FILE" --clobber
