name: enterprise-acceptance

on:
  workflow_dispatch:
  push:
    branches: ["acceptance/**"]

permissions:
  contents: read

concurrency:
  group: enterprise-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  system:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 22
          - os: macos-latest
            node: 22
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-search
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run version:check
      - run: npm run build:web
      - run: npm run typecheck:web
      - run: npm run release:verify
      - run: npx playwright install chromium
      - run: npm run test:web
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: acceptance-${{ matrix.os }}-node-${{ matrix.node }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
