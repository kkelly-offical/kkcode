name: verify

on:
  push:
    branches: ["main"]
  pull_request:

# 这个工作流只需要读代码。不声明时 GITHUB_TOKEN 拿的是仓库默认权限，
# 可能含写权限 —— 对一个跑第三方依赖代码的测试矩阵来说是不必要的授权。
permissions:
  contents: read

jobs:
  verify:
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 22
          - os: macos-latest
            node: 22
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-search
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # 1.0.0 阶段 4：import 环检测在 release:verify 里已常驻，这里单列一步
      # 让环回归在 CI 矩阵里一眼定位（只加步骤，不改既有门禁）。
      - run: node scripts/check-import-cycles.mjs
      - run: npm run release:verify
  web-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run version:check
      - run: npm run typecheck:web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
      - run: npm run test:browser
