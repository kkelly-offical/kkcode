name: verify

on:
  push:
    branches: ["main"]
  pull_request:

# 这个工作流只需要读代码。不声明时 GITHUB_TOKEN 拿的是仓库默认权限，
# 可能含写权限 —— 对一个跑第三方依赖代码的测试矩阵来说是不必要的授权。
permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 22
          - os: macos-latest
            node: 22
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run release:verify
