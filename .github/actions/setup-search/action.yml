name: Install search dependency
description: Ensure the same ripgrep-backed tool tests run on every supported OS.
runs:
  using: composite
  steps:
    - name: Install ripgrep on Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        if ! command -v rg >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y ripgrep
        fi
        rg --version
    - name: Install ripgrep on macOS
      if: runner.os == 'macOS'
      shell: bash
      run: |
        if ! command -v rg >/dev/null 2>&1; then
          brew install ripgrep
        fi
        rg --version
    - name: Install ripgrep on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        if (-not (Get-Command rg -ErrorAction SilentlyContinue)) {
          choco install ripgrep --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
        rg --version
