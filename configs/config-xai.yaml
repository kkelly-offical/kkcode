# kkcode 配置 — xAI Grok
# 适用于使用 xAI API 的用户。
#
# 环境变量:
#   export XAI_API_KEY="your-xai-key"

provider:
  default: xai

  xai:
    type: openai-compatible
    base_url: https://api.x.ai/v1
    api_key_env: XAI_API_KEY
    default_model: grok-4.3
    models:
      - grok-4.3
      - grok-4.3-latest
    timeout_ms: 120000
    stream_idle_timeout_ms: 120000
    max_tokens: 32768
    retry_attempts: 3
    retry_base_delay_ms: 800
    stream: true
