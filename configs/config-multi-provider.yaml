# kkcode 配置 — 多 Provider 组合
# 同时配置多个模型提供商，按需切换
# 适用于需要在不同模型间灵活选择的团队
#
# 环境变量:
#   export DASHSCOPE_API_KEY="your-dashscope-key"
#   export DEEPSEEK_API_KEY="your-deepseek-key"
#   export ZHIPU_API_KEY="your-zhipu-key"
#   export ANTHROPIC_API_KEY="your-anthropic-key"
#   export OPENAI_API_KEY="your-openai-key"
#   export GEMINI_API_KEY="your-gemini-key"
#   export MOONSHOT_API_KEY="your-kimi-key"
#   export XAI_API_KEY="your-xai-key"

provider:
  # 默认使用 DashScope（Qwen 系列）
  default: dashscope

  dashscope:
    type: openai-compatible
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY
    default_model: qwen3.5-plus
    models:
      - qwen3.5-plus
      - qwen3.5-flash
      - qwen3-max
      - qwen3-coder-plus
      - qwen-plus-latest
    timeout_ms: 120000
    stream_idle_timeout_ms: 120000
    max_tokens: 32768
    retry_attempts: 5
    retry_base_delay_ms: 800
    stream: true

  deepseek:
    type: openai-compatible
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    default_model: deepseek-v4-flash
    models:
      - deepseek-v4-flash
      - deepseek-v4-pro
      # Compatibility aliases scheduled for deprecation on 2026-07-24.
      - deepseek-chat
      - deepseek-reasoner
    timeout_ms: 120000
    stream_idle_timeout_ms: 120000
    max_tokens: 32768
    retry_attempts: 5
    retry_base_delay_ms: 800
    stream: true

  zhipu:
    type: openai-compatible
    base_url: https://open.bigmodel.cn/api/paas/v4
    api_key_env: ZHIPU_API_KEY
    default_model: glm-5.1
    models:
      - glm-5.1
      - glm-5
      - glm-4.5
    timeout_ms: 120000
    stream_idle_timeout_ms: 120000
    max_tokens: 32768
    retry_attempts: 5
    retry_base_delay_ms: 800
    stream: true

  anthropic:
    type: anthropic
    api_key_env: ANTHROPIC_API_KEY
    default_model: claude-sonnet-5
    models:
      - claude-opus-5
      - claude-sonnet-5
      - claude-haiku-4-5
    timeout_ms: 120000
    stream_idle_timeout_ms: 120000
    max_tokens: 32768
    retry_attempts: 5
    retry_base_delay_ms: 800
    stream: true

  openai:
    type: openai
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    default_model: gpt-5.6-terra
    models:
      # 5.6 家族：sol 最强、terra 平衡、luna 低成本
      - gpt-5.6-sol
      - gpt-5.6-terra
      - gpt-5.6-luna
      - gpt-5.5
      - gpt-5.4
      - gpt-5.3-codex
    timeout_ms: 120000
    stream_idle_timeout_ms: 120000
    max_tokens: 32768
    retry_attempts: 5
    retry_base_delay_ms: 800
    stream: true

  gemini:
    type: openai-compatible
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY
    default_model: gemini-3.6-flash
    models:
      - gemini-3.6-flash
      - gemini-3.5-flash
      - gemini-3.1-pro
      - gemini-3.1-flash-lite
    timeout_ms: 120000
    stream_idle_timeout_ms: 120000
    max_tokens: 32768
    retry_attempts: 5
    retry_base_delay_ms: 800
    stream: true

  kimi:
    type: openai-compatible
    base_url: https://api.moonshot.ai/v1
    api_key_env: MOONSHOT_API_KEY
    default_model: kimi-k3
    models:
      - kimi-k3
      - kimi-k2.7-code
      - kimi-k2.6
    timeout_ms: 120000
    stream_idle_timeout_ms: 120000
    max_tokens: 32768
    retry_attempts: 5
    retry_base_delay_ms: 800
    stream: true

  xai:
    type: openai-compatible
    base_url: https://api.x.ai/v1
    api_key_env: XAI_API_KEY
    default_model: grok-4.5
    models:
      - grok-4.5
      - grok-4.3
    timeout_ms: 120000
    stream_idle_timeout_ms: 120000
    max_tokens: 32768
    retry_attempts: 5
    retry_base_delay_ms: 800
    stream: true
