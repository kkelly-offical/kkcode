# kkcode 配置 — DeepSeek V4
# 适用于使用 DeepSeek 官方 API 的用户
# 获取 API Key: https://platform.deepseek.com/
#
# 环境变量:
#   export DEEPSEEK_API_KEY="your-api-key-here"

provider:
  default: deepseek

  deepseek:
    type: openai-compatible
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    default_model: deepseek-v4-flash
    models:
      # V4 Flash — 默认通用模型，支持非思考 / 思考模式
      - deepseek-v4-flash
      # V4 Pro — 更强推理场景
      - deepseek-v4-pro
      # 兼容旧别名：官方计划于 2026-07-24 废弃
      - deepseek-chat
      - deepseek-reasoner
    timeout_ms: 120000
    stream_idle_timeout_ms: 120000
    max_tokens: 32768
    retry_attempts: 5
    retry_base_delay_ms: 800
    stream: true
