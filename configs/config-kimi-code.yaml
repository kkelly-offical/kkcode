# KK Code configuration — Kimi Code Coding API
#
# Keep credentials outside this file:
#   export KIMI_CODE_API_KEY="your-kimi-code-key"
#
# Every model on this endpoint is thinking-only, so reasoning tokens come out
# of max_tokens. Keep it generous — a small budget can be consumed entirely by
# reasoning and return empty content.

config_version: 1

provider:
  default: kimi-code

  model_context:
    k3: 1048576
    k3-256k: 262144
    kimi-for-coding: 262144
    kimi-for-coding-highspeed: 262144

  kimi-code:
    type: openai-compatible
    base_url: https://api.kimi.com/coding/v1
    api_key_env: KIMI_CODE_API_KEY
    default_model: k3
    models:
      - k3                          # K3 — 1M context
      - k3-256k                     # K3 — 256K context
      - kimi-for-coding             # K2.7 Coding
      - kimi-for-coding-highspeed   # K2.7 Coding Highspeed
    context_limit: 1048576
    timeout_ms: 240000
    stream_idle_timeout_ms: 240000
    max_tokens: 32768
    retry_attempts: 5
    retry_base_delay_ms: 800
    stream: true
    reasoning_effort: high

# 0.4.0 model roles. fast powers inline ghost text and session titles.
#
# fast is deliberately left unset: every model on this channel is thinking-only,
# and the fast channel gives helper calls a 32-token budget with a 4s timeout —
# the reasoning pass consumes the whole budget and the visible text comes back
# empty every time. Pointing fast here does not merely fail, it fails silently
# while still spending tokens on each keystroke pause.
#
# To enable ghost text, point fast at an instant-answer model on another
# channel using the provider/model form, e.g.:
#   fast: aliyun/qwen3.7-flash
models:
  main: k3
  fast: null
  subagent: kimi-for-coding
