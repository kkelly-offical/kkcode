name: kkcode-enterprise-lab
services:
  gateway-database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kkcode
      POSTGRES_USER: kkcode
      POSTGRES_PASSWORD: ${GATEWAY_DB_PASSWORD:?generated by setup-lab}
    volumes: [gateway-database:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U kkcode -d kkcode']
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  sso-database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${SSO_DB_PASSWORD:?generated by setup-lab}
    volumes: [sso-database:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U keycloak -d keycloak']
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  sso:
    image: quay.io/keycloak/keycloak:26.6
    command: [start, --http-enabled=true, --proxy-headers=xforwarded, --import-realm]
    environment:
      KC_HOSTNAME: https://${KKCODE_LAB_IP}:${SSO_PORT}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://sso-database:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${SSO_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: lab-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${SSO_ADMIN_PASSWORD:?generated by setup-lab}
      KC_HEALTH_ENABLED: 'true'
    volumes:
      - ${KKCODE_LAB_STATE}/realm.json:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      sso-database: {condition: service_healthy}
    restart: unless-stopped
  gateway:
    build: {context: ../.., dockerfile: deploy/Dockerfile}
    image: kkcode-enterprise-lab-gateway:1.0.3
    environment:
      DATABASE_URL: postgresql://kkcode:${GATEWAY_DB_PASSWORD}@gateway-database:5432/kkcode
      KKCODE_GATEWAY_ORIGIN: https://${KKCODE_LAB_IP}:${GATEWAY_PORT}
      KKCODE_OIDC_ISSUER: https://${KKCODE_LAB_IP}:${SSO_PORT}/realms/kkcode
      KKCODE_OIDC_CLIENT_ID: kkcode-gateway
      KKCODE_OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?generated by setup-lab}
      KKCODE_ORGANIZATION: KK Code Enterprise Lab
      NODE_EXTRA_CA_CERTS: /lab-ca.crt
    volumes:
      - ${KKCODE_LAB_STATE}/ca.crt:/lab-ca.crt:ro
    depends_on:
      gateway-database: {condition: service_healthy}
      sso: {condition: service_started}
    restart: unless-stopped
  proxy:
    image: caddy:2-alpine
    ports:
      - 127.0.0.1:${SSO_PORT}:${SSO_PORT}
      - ${KKCODE_LAB_IP}:${SSO_PORT}:${SSO_PORT}
      - 127.0.0.1:${GATEWAY_PORT}:${GATEWAY_PORT}
      - ${KKCODE_LAB_IP}:${GATEWAY_PORT}:${GATEWAY_PORT}
    volumes:
      - ${KKCODE_LAB_STATE}/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${KKCODE_LAB_STATE}/tls.crt:/tls/cert.pem:ro
      - ${KKCODE_LAB_STATE}/tls.key:/tls/key.pem:ro
    restart: unless-stopped
volumes:
  gateway-database:
  sso-database:
